# Keyword/feed search sources (broad: any industry). Hosted app: each user's job
# titles become Himalayas searches automatically. Local CLI: `keywords` below.
search:
  himalayas: true        # himalayas.app remote jobs, one search per keyword (credit: "via Himalayas")
  jobicy: true           # jobicy.com: the 200 newest US remote jobs, one request per run
  muse: true             # themuse.com (needs MUSE_API_KEY): 200 newest remote jobs + users' "City, ST" cities
  adzuna: true           # adzuna.com (needs ADZUNA_APP_ID/KEY): job titles x remote/cities, short descriptions
  keywords: [qa engineer, sdet, test automation, quality assurance, devops engineer]

# ---------------------------------------------------------------
# Hosted app (Firebase) only. Search settings (titles, locations,
# min score) are per user and edited on the Settings screen.
# ---------------------------------------------------------------
cloud:
  signup: open                  # open: anyone with a Google account gets in | approval: you approve on the Users screen
  monthly_budget_usd: 25        # estimated Claude API spend cap for everyone except you; their runs pause when reached
  owner_runs_per_day: 10        # manual "Run search" presses per day (the 7am run is extra)
  friend_limits:                # everyone else: keeps API costs predictable
    runs_per_day: 2
    max_score_per_run: 80
    max_tailor_per_run: 5
  inactive_days: 14             # the 7am run skips friends who haven't opened the app in this long
  first_run_multiplier: 2       # a new user's first run scores/tailors this many times more (clears the backlog)
  expire_unscored_days: 14      # queued jobs still unscored after this long are dropped (postings go stale)
